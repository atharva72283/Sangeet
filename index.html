<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ek DM ki keemat – #Sanket की रीत</title>

<meta name="description" content="Welcome to the wedding of Sanket and Ritika.">
<meta property="og:title" content="Ek DM ki keemat – #Sanket की रीत">
<meta property="og:description" content="Welcome to the wedding of Sanket and Ritika.">
<meta property="og:type" content="website">
<link rel="icon" href="logo.jpg">
<link rel="preload" as="image" href="logo.jpg">

<link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Bebas+Neue&family=Great+Vibes&family=Hind:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,600&display=swap" rel="stylesheet">
<script>document.documentElement.className+=' js';</script>
<style>
:root{
  --red:#E50914;
  --red-hi:#ff3b45;
  --red-deep:#6b0509;
  --black:#000;
  --line:#2b2b2b;
  --mute:#b3b3b3;
  --white:#fff;
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --script:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --dev:"Amita","Hind",sans-serif;
  --body:"Hind","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--black);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--white);outline-offset:3px}
body.locked{overflow:hidden}

/* =====================  INTRO: logo assembles from lines  ===================== */
.intro{
  position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden;
  transition:opacity 1s ease, visibility 1s;
}
.intro.out{opacity:0;visibility:hidden}
.beams{position:absolute;inset:0;pointer-events:none}
.beams i{
  position:absolute;top:0;bottom:0;left:var(--x);width:var(--w);
  background:linear-gradient(to bottom,transparent,var(--c) 28%,var(--c) 72%,transparent);
  transform:scaleY(0);opacity:0;
  animation:beam 2s var(--d) cubic-bezier(.2,.7,.2,1) both;
}
@keyframes beam{0%{transform:scaleY(0);opacity:0}25%{opacity:.95}100%{transform:scaleY(1);opacity:0}}

.seal{
  --s:min(76vw,400px);--n:64;
  position:relative;display:flex;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;
  box-shadow:0 0 110px rgba(229,9,20,.38);
  transition:transform 1.1s cubic-bezier(.3,.6,.2,1);
}
.intro.out .seal{transform:scale(1.35)}
.seal i{
  flex:none;width:calc(var(--s) / var(--n) + 1px);margin-right:-1px;height:100%;
  background:url("logo.jpg") calc(var(--i) * var(--s) / var(--n) * -1) 0 / var(--s) var(--s) no-repeat;
  opacity:0;
  animation:strip .95s calc(.4s + var(--k) * .021s) cubic-bezier(.2,.75,.2,1) both;
}
@keyframes strip{
  from{opacity:0;transform:translateY(var(--dir)) scaleY(.15);filter:blur(7px) brightness(2)}
  to{opacity:1;transform:none;filter:none}
}
.skip{
  position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:50%;transform:translateX(-50%);
  height:40px;padding:0 20px;border-radius:999px;border:1px solid #444;color:var(--mute);font-size:14px;
  opacity:0;animation:fadeIn .6s 1s both;
}
.skip:hover{color:var(--white);border-color:#777}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* =====================  HERO  ===================== */
.hero{
  position:relative;min-height:100svh;display:flex;flex-direction:column;
  padding:18px 22px 40px;overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(229,9,20,.40), rgba(229,9,20,0) 70%),
    radial-gradient(90% 50% at 50% 100%, rgba(107,5,9,.55), rgba(0,0,0,0) 70%),
    #000;
}
.geo{
  position:absolute;left:50%;top:50%;width:min(150vw,980px);aspect-ratio:1;
  margin:calc(min(150vw,980px) / -2) 0 0 calc(min(150vw,980px) / -2);
  opacity:.55;pointer-events:none;
}
.geo svg{width:100%;height:100%;overflow:visible}
@media (prefers-reduced-motion:no-preference){.geo svg{animation:spin 140s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(#000 0,transparent 10%,transparent 90%,#000 100%);opacity:.6;
}
.bar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.mini{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 1px rgba(229,9,20,.6),0 0 24px rgba(229,9,20,.35)}
.bar .nm{font-family:var(--script);font-size:28px;color:var(--white);line-height:1}

.hero-body{position:relative;z-index:2;margin:auto 0;padding:34px 0 20px;text-align:center}
.pre{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:19px;color:var(--mute)}
.couple{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(52px,15vw,96px);line-height:1;color:var(--white)}
.couple span{display:block}
.couple .and{font-family:var(--serif);font-style:italic;font-weight:500;font-size:.34em;line-height:1.5;color:var(--mute)}
.hashtag{
  margin:14px 0 0;font-family:var(--serif);font-weight:700;font-size:clamp(28px,8.4vw,52px);line-height:1.2;color:var(--red);
}
.hashtag .dv{font-family:var(--dev);font-weight:700;color:inherit}
.title{margin:10px 0 0;font-weight:400;line-height:.98}
.title span{
  display:inline-block;font-family:var(--display);font-size:clamp(60px,19vw,170px);letter-spacing:.04em;max-width:100%;line-height:.92;padding:0 .08em .04em;text-transform:uppercase;
  background:linear-gradient(100deg,#8e0610 18%,#ff3b45 42%,#fff 50%,#ff3b45 58%,#8e0610 82%) 0 0/260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 26px rgba(229,9,20,.5));
}
@media (prefers-reduced-motion:no-preference){
  .hero.enter .title span{animation:shine 3.2s 1.3s ease-in-out 1 both}
}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.meta{margin:14px 0 0;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;color:var(--mute);font-size:15px}
.meta b{color:#46d369;font-weight:600}
.meta span+span::before{content:"|";margin-right:14px;color:#444}
.cta{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 30px;
  border-radius:999px;font-weight:600;font-size:18px;text-decoration:none;transition:transform .15s ease, background-color .15s ease;
}
.btn:active{transform:scale(.97)}
.btn svg{width:26px;height:26px}
.btn-play{background:var(--white);color:var(--black)}
.btn-play:hover{background:#e6e6e6}
.btn-ghost{background:rgba(109,109,110,.55);color:var(--white)}
.btn-ghost:hover{background:rgba(109,109,110,.8)}

/* hero entrance (one orchestrated moment, after the intro) */
.js .rv{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .hero.enter .rv{animation:rise 1s calc(var(--r) * .16s + .2s) cubic-bezier(.2,.7,.2,1) both}
  .hero.enter .title.rv{animation:bloom 1.5s .55s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes bloom{from{opacity:0;transform:scale(1.3);letter-spacing:.1em}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1}}

/* =====================  EPISODES (poster row)  ===================== */
.episodes{padding:30px 0 56px;max-width:1100px;margin:0 auto}
.episodes h2{margin:0 18px 2px;font-family:var(--serif);font-size:28px;font-weight:700}
.episodes .sub{margin:0 18px 8px;color:var(--mute);font-size:15px}
.row{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 18px 26px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.row::-webkit-scrollbar{display:none}
.card{
  flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;position:relative;text-align:left;
  scroll-margin-left:18px;
}
.big{
  font-family:var(--serif);font-weight:900;font-size:168px;line-height:.78;color:#000;
  -webkit-text-stroke:3px #6b6b6b;margin-right:-30px;position:relative;z-index:1;
  transition:-webkit-text-stroke-color .2s ease;
}
.card:hover .big,.card:focus-visible .big{-webkit-text-stroke-color:var(--red)}
.poster{
  position:relative;width:152px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;z-index:2;
  background:linear-gradient(160deg,var(--red-deep),#150002 80%);
  box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .2s ease;
}
.card:hover .poster{transform:translateY(-4px)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster.missing img{display:none}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0) 62%)}
.poster .pb{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.55);border:2px solid var(--white);
}
.pb svg{width:20px;height:20px;margin-left:2px}
.poster .tt{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:3;
  font-family:var(--serif);font-style:italic;font-weight:600;font-size:16px;line-height:1.25;
}
.poster .ep{
  position:absolute;left:10px;top:10px;z-index:3;font-family:var(--script);font-size:24px;line-height:1;color:var(--white);
  text-shadow:0 1px 8px rgba(0,0,0,.8);
}
.end{margin:6px 18px 0;text-align:center;color:var(--mute)}
.end img{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto 8px}
.end b{display:block;font-family:var(--script);font-weight:400;font-size:32px;color:var(--white);line-height:1.1}
.end span{font-family:var(--serif);font-style:italic;font-size:16px}

/* Season 2 teaser */
.soon-h{margin:6px 18px 10px;font-family:var(--serif);font-size:22px;font-weight:700}
.soon{
  margin:0 18px 30px;display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:12px;
  border:1px dashed #6b0509;background:linear-gradient(120deg,rgba(107,5,9,.45),rgba(0,0,0,.15));
}
.sbig{font-family:var(--display);font-size:120px;line-height:.8;color:#000;-webkit-text-stroke:3px var(--red);flex:none}
.sbody{display:flex;flex-direction:column;gap:2px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px;letter-spacing:.14em;color:var(--red-hi)}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.badge::before{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.sname{font-family:var(--script);font-size:34px;line-height:1.1;color:var(--white)}
.stitle{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;line-height:1.25}

/* =====================  VIEWER (photo carousel)  ===================== */
.viewer{
  position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 16px);
}
.viewer.open{display:flex}
@media (prefers-reduced-motion:no-preference){.viewer.open{animation:fadeIn .3s ease both}}
.segs{display:flex;gap:5px;padding:0 16px}
.segs span{flex:1;height:3px;border-radius:2px;background:#3a3a3a}
.segs span.done{background:#8c8c8c}
.segs span.now{background:var(--red)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 0}
.vhead .t{min-width:0}
.vhead .e{margin:0;font-family:var(--script);font-size:32px;color:var(--red-hi);line-height:1}
.vhead h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25}
.close{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#1f1f1f}
.close:hover{background:#333}
.close svg{width:20px;height:20px}
.stage{
  position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.track{display:flex;height:100%;width:100%;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.slide{flex:none;width:100%;display:flex;align-items:center;justify-content:center;padding:14px 16px}
.frame{
  position:relative;height:100%;max-height:100%;aspect-ratio:4/5;max-width:100%;
  border-radius:14px;overflow:hidden;border:1px solid rgba(229,9,20,.55);
  background:linear-gradient(150deg,var(--red-deep),#120001);
  box-shadow:0 20px 60px rgba(229,9,20,.18);
}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;-webkit-user-drag:none}
.frame.missing img{display:none}
.frame .ph{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  font-family:var(--script);font-size:clamp(110px,40vw,230px);color:rgba(255,255,255,.14);
}
.frame.missing .ph{display:flex}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  display:none;place-items:center;background:rgba(0,0,0,.65);border:1px solid #444;z-index:3;
}
.nav:hover{background:rgba(40,40,40,.9)}
.nav[disabled]{opacity:.25;cursor:default}
.nav svg{width:22px;height:22px}
.nav.prev{left:12px}.nav.next{right:12px}
@media (hover:hover) and (min-width:700px){.nav{display:grid}}
.cap{padding:6px 24px 0;text-align:center;min-height:100px}
.cap p{margin:0 auto;max-width:32ch;font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;line-height:1.4}
.cap .count{display:block;margin-top:8px;color:var(--mute);font-size:14px}
.nextep{
  display:none;margin:12px auto 0;height:44px;padding:0 22px;border-radius:999px;
  background:var(--white);color:var(--black);font-weight:600;font-size:16px;
}
.nextep.show{display:block}
</style>
</head>
<body class="locked">

<!-- INTRO -->
<div class="intro" id="intro">

</div>

<header class="hero" id="top">

<main>

      </div>

      <img src="logo.jpg" alt="" width="56" height="56">
      <b>Ritika weds Sanket</b>
      <span>11 &amp; 12 December 2026</span>
    </div>
  </section>
</main>

<!-- Photo carousel -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle" hidden>
  <div class="segs" id="segs" aria-hidden="true"></div>
  <div class="vhead">
    <div class="t">
      <p class="e" id="vEp"></p>
      <h2 id="vTitle"></h2>
    </div>
    <button class="close" id="vClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="vPrev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <div class="track" id="track"></div>
    <button class="nav next" id="vNext" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>
  <div class="cap" aria-live="polite">
    <p id="vCap"></p>
    <span class="count" id="vCount"></span>
    <button class="nextep" id="vNextEp" type="button"></button>
  </div>
</div>

<script>
/* =====================================================================
   EDIT HERE — one entry per episode.
   Photo names have NO extension here: "ep1-3" finds ep1-3.jpg (also
   .jpeg, .png, .webp). Keep them in the photos folder. If a photo is
   missing, a red placeholder card shows instead (the page never breaks).
   Change only the captions (cap) unless you add or remove photos.

var EPISODES = [

  ]},
  { title: "Off the syllabus", slides: [

    { img: "ep3-3", cap: "Photo 3 – add your one-liner here." },
    { img: "ep3-4", cap: "Photo 4 – add your one-liner here." }
  ]},
  { title: "From online help to offline meetups", slides: [
    { img: "ep4-1", cap: "Photo 1 – add your one-liner here." },
    { img: "ep4-2", cap: "Photo 2 – add your one-liner here." },
    { img: "ep4-3", cap: "Photo 3 – add your one-liner here." },
    { img: "ep4-4", cap: "Photo 4 – add your one-liner here." }
  ]},
  { title: "The toughest Viva", slides: [
    { img: "ep5-1", cap: "Photo 1 – add your one-liner here." },
    { img: "ep5-2", cap: "Photo 2 – add your one-liner here." },
    { img: "ep5-3", cap: "Photo 3 – add your one-liner here." },
    { img: "ep5-4", cap: "Photo 4 – add your one-liner here." },
    { img: "ep5-5", cap: "Photo 5 – add your one-liner here." }
  ]},
  { title: "The conclusion", slides: [
    { img: "ep6-1", cap: "Photo 1 – add your one-liner here." },
    { img: "ep6-2", cap: "Photo 2 – add your one-liner here." },
    { img: "ep6-3", cap: "Photo 3 – add your one-liner here." },
    { img: "ep6-4", cap: "Photo 4 – add your one-liner here." },
    { img: "ep6-5", cap: "Photo 5 – add your one-liner here." },
    { img: "ep6-6", cap: "Photo 5 – add your one-liner here." }
  ]}
];
/* ===================== end of editable section ===================== */

(function () {
  var PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 5.2v13.6a1.2 1.2 0 0 0 1.82 1.03l11.2-6.8a1.2 1.2 0 0 0 0-2.06L9.32 4.17A1.2 1.2 0 0 0 7.5 5.2Z"/></svg>';
  var $ = function (id) { return document.getElementById(id); };
  var EXTS = ['jpg', 'jpeg', 'png', 'webp', 'JPG'];
  function setSrc(img, base, onFail) {
    var k = 0;
    img.onerror = function () {
      k++;
      if (k < EXTS.length) { img.src = PHOTO_DIR + base + '.' + EXTS[k]; }
      else { img.onerror = null; onFail(); }
    };
    img.src = PHOTO_DIR + base + '.' + EXTS[0];
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Background geometry (echoes the logo's twin polygons) ---------- */
  (function () {
    var svg = $('geo'), NS = 'http://www.w3.org/2000/svg';
    function poly(r, rot, stroke, op) {
      var pts = [];
      for (var k = 0; k < 12; k++) {
        var a = (rot + k * 30) * Math.PI / 180;
        pts.push((r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1));
      }
      var p = document.createElementNS(NS, 'polygon');
      p.setAttribute('points', pts.join(' '));
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', stroke);
      p.setAttribute('stroke-opacity', op);
      p.setAttribute('stroke-width', '1.4');
      p.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(p);
    }
    poly(380, 0, '#E50914', .55);
    poly(380, 15, '#E50914', .35);
    poly(300, 7, '#ffffff', .12);
  })();

  /* ---------- Intro: logo assembles from vertical lines ---------- */
  var intro = $('intro'), hero = document.querySelector('.hero'), ended = false;

  (function buildIntro() {
    var N = 64, seal = $('seal'), beams = $('beams'), i;
    seal.style.setProperty('--n', N);
    for (i = 0; i < N; i++) {
      var s = document.createElement('i');
      s.style.setProperty('--i', i);
      s.style.setProperty('--k', Math.abs(i - (N - 1) / 2).toFixed(2));
      s.style.setProperty('--dir', (i % 2 ? '-' : '') + '55%');
      seal.appendChild(s);
    }
    /* light streaks, deterministic so every visit looks the same */
    var colors = ['#E50914', '#ff3b45', '#8e0610', '#ffffff', '#E50914'];
    for (i = 0; i < 36; i++) {
      var b = document.createElement('i');
      var x = ((i * 37 + 11) % 100);
      b.style.setProperty('--x', x + '%');
      b.style.setProperty('--w', (1 + (i % 3)) + 'px');
      b.style.setProperty('--c', colors[i % colors.length]);
      b.style.setProperty('--d', ((i * 0.07) % 1.2).toFixed(2) + 's');
      beams.appendChild(b);
    }
  })();

  function endIntro() {
    if (ended) return; ended = true;
    intro.classList.add('out');
    hero.classList.add('enter');
    document.body.classList.remove('locked');
    setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1300);
  }
  $('skip').addEventListener('click', endIntro);
  intro.addEventListener('click', endIntro);
  setTimeout(endIntro, reduce ? 500 : 4300);

  /* ---------- Episode posters ---------- */
  var row = $('row');
  EPISODES.forEach(function (ep, i) {
    var b = document.createElement('button');
    b.className = 'card'; b.type = 'button'; b.setAttribute('data-i', i);
    b.setAttribute('aria-label', 'Play episode ' + (i + 1) + ': ' + ep.title);
    b.innerHTML =
      '<span class="big" aria-hidden="true">' + (i + 1) + '</span>' +
      '<span class="poster">' +
        '<img alt="" loading="lazy">' +
        '<span class="ep" aria-hidden="true">Episode ' + (i + 1) + '</span>' +
        '<span class="pb">' + PLAY_ICON + '</span>' +
        '<span class="tt">' + esc(ep.title) + '</span>' +
      '</span>';
    var img = b.querySelector('img');
    setSrc(img, ep.slides[0].img, function () { img.parentNode.classList.add('missing'); });
    row.appendChild(b);
  });
  row.addEventListener('click', function (e) {
    var b = e.target.closest('.card');
    if (b) openEpisode(+b.getAttribute('data-i'), b);
  });
  $('heroPlay').addEventListener('click', function (e) { openEpisode(0, e.currentTarget); });

  /* ---------- Viewer ---------- */
  var viewer = $('viewer'), track = $('track'), segs = $('segs');
  var vEp = $('vEp'), vTitle = $('vTitle'), vCap = $('vCap'), vCount = $('vCount');
  var vPrev = $('vPrev'), vNext = $('vNext'), vClose = $('vClose'), vNextEp = $('vNextEp'), stage = $('stage');
  var epIndex = 0, slideIndex = 0, lastTrigger = null;

  function build(i) {
    var ep = EPISODES[i];
    track.innerHTML = ''; segs.innerHTML = '';
    ep.slides.forEach(function (s) {
      var slide = document.createElement('div');
      slide.className = 'slide';
      slide.innerHTML = '<div class="frame"><img alt="" draggable="false"><span class="ph" aria-hidden="true">' + (i + 1) + '</span></div>';
      var img = slide.querySelector('img');
      setSrc(img, s.img, function () { img.parentNode.classList.add('missing'); });
      track.appendChild(slide);
      segs.appendChild(document.createElement('span'));
    });
  }

  function render() {
    var ep = EPISODES[epIndex], n = ep.slides.length;
    track.style.transform = 'translateX(' + (-100 * slideIndex) + '%)';
    Array.prototype.forEach.call(segs.children, function (s, k) {
      s.className = k < slideIndex ? 'done' : (k === slideIndex ? 'now' : '');
    });
    vCap.textContent = ep.slides[slideIndex].cap;
    vCount.textContent = (slideIndex + 1) + ' / ' + n;
    vPrev.disabled = slideIndex === 0;
    vNext.disabled = slideIndex === n - 1;
    if (slideIndex === n - 1 && epIndex < EPISODES.length - 1) {
      vNextEp.textContent = 'Next episode: ' + EPISODES[epIndex + 1].title;
      vNextEp.classList.add('show');
    } else {
      vNextEp.classList.remove('show');
    }
  }

  function openEpisode(i, trigger) {
    epIndex = i; slideIndex = 0;
    if (trigger) lastTrigger = trigger;
    vEp.textContent = 'Episode ' + (i + 1);
    vTitle.textContent = EPISODES[i].title;
    build(i); render();
    viewer.hidden = false;
    viewer.classList.add('open');
    document.body.classList.add('locked');
    vClose.focus();
  }

  function closeViewer() {
    viewer.classList.remove('open');
    viewer.hidden = true;
    document.body.classList.remove('locked');
    if (lastTrigger) lastTrigger.focus();
  }

  function go(d) {
    var n = EPISODES[epIndex].slides.length;
    var next = Math.min(n - 1, Math.max(0, slideIndex + d));
    if (next !== slideIndex) { slideIndex = next; render(); }
  }

  vPrev.addEventListener('click', function () { go(-1); });
  vNext.addEventListener('click', function () { go(1); });
  vClose.addEventListener('click', closeViewer);
  vNextEp.addEventListener('click', function () { openEpisode(epIndex + 1); });

  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Tab') {
      var f = viewer.querySelectorAll('button:not([disabled])');
      var vis = Array.prototype.filter.call(f, function (el) { return el.offsetParent !== null; });
      if (!vis.length) return;
      var first = vis[0], last = vis[vis.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  var x0 = null;
  stage.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  stage.addEventListener('pointerup', function (e) {
    if (x0 === null) return;
    var dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', function () { x0 = null; });
})();
</script>
</body>
</html>
